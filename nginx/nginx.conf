worker_processes auto;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  gzip on;
  gzip_types text/css application/json application/javascript text/xml;
  upstream backend { server backend:4000; }
  upstream frontend { server frontend:3000; }
  server {
    listen 80;
    server_name ayantaraz.com www.ayantaraz.com 202.133.91.13;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    location /api/ { proxy_pass http://backend; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
    location /_next/ { proxy_pass http://frontend; proxy_set_header Host $host; expires 30d; add_header Cache-Control "public, immutable"; }
    location /images/ { proxy_pass http://frontend; proxy_set_header Host $host; expires 7d; }
    location / { proxy_pass http://frontend; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; }
  }
}
