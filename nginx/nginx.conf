worker_processes auto;
worker_rlimit_nofile 65535;

events {
  worker_connections 4096;
  multi_accept on;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # ── Logging ──
  access_log /var/log/nginx/access.log combined buffer=32k flush=5s;
  error_log /var/log/nginx/error.log warn;

  # ── Basic performance ──
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  keepalive_requests 100;
  server_tokens off;
  client_max_body_size 25m;

  # ── Gzip compression (text assets) ──
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_buffers 16 8k;
  gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/x-javascript
    application/json
    application/xml
    application/xml+rss
    application/atom+xml
    image/svg+xml
    font/woff2
    application/manifest+json;

  # ── Upstreams ──
  upstream backend { server backend:4000; least_conn; }
  upstream frontend { server frontend:3000; least_conn; }

  # ── Rate limiting (burst tolerance) ──
  limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
  limit_req_zone $binary_remote_addr zone=login:10m rate=5r/s;

  server {
    listen 80;
    http2 on;
    server_name _;

    # ── Security headers ──
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-DNS-Prefetch-Control on always;

    # ── API (backend) ──
    location /api/ {
      limit_req zone=api burst=60 nodelay;
      proxy_pass http://backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 60s;
    }

    # ── Auth/login endpoints — stricter rate limit ──
    location ~ ^/api/(auth|admin)/ {
      limit_req zone=login burst=10 nodelay;
      proxy_pass http://backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Uploaded media ──
    location /uploads/ {
      proxy_pass http://backend;
      proxy_set_header Host $host;
      expires 7d;
      add_header Cache-Control "public" always;
    }

    # ── Next.js hashed static assets — immutable 1yr cache ──
    location /_next/static/ {
      proxy_pass http://frontend;
      proxy_set_header Host $host;
      expires 1y;
      add_header Cache-Control "public, immutable" always;
    }

    # ── Other Next.js routes ──
    location /_next/ {
      proxy_pass http://frontend;
      proxy_set_header Host $host;
      expires 30d;
      add_header Cache-Control "public" always;
    }

    location /images/ {
      proxy_pass http://frontend;
      proxy_set_header Host $host;
      expires 7d;
      add_header Cache-Control "public" always;
    }

    # ── Favicon & static root files ──
    location ~* \.(ico|png|jpg|jpeg|webp|svg|css|js|woff2|manifest)$ {
      proxy_pass http://frontend;
      proxy_set_header Host $host;
      expires 7d;
      add_header Cache-Control "public" always;
    }

    # ── Frontend (SSR/SSG) ──
    location / {
      proxy_pass http://frontend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_read_timeout 60s;
      proxy_buffering on;
      proxy_buffer_size 16k;
      proxy_buffers 8 32k;
    }
  }
}
