services:
  postgres:
    image: postgres:16-alpine
    container_name: ayan-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ayan_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-ayan_taraz}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ayan_user}"]
      interval: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ayan-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ayan-backend
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - uploads:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:4000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # IMPORTANT: must stay EMPTY for production behind Nginx.
        # The browser calls the API via the relative "/api" path which Nginx
        # proxies to the backend. Setting this to http://backend:4000 breaks
        # browser requests (the browser cannot resolve the internal hostname),
        # which is what caused the admin panel infinite-refresh loop.
        NEXT_PUBLIC_API_URL: ""
        NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL:-http://localhost}
    container_name: ayan-frontend
    restart: unless-stopped
    env_file: .env
    environment:
      # Internal API URL for server-side rendering (SSR) fetches.
      # Frontend container can reach backend via docker network hostname.
      INTERNAL_API_URL: http://backend:4000
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  nginx:
    image: nginx:alpine
    container_name: ayan-nginx
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # SSL certs are mounted at deploy time by deploy.sh (update_compose_ssl).
      # Leave this commented out for HTTP-only deployments.
    ports:
      - "80:80"
      # Port 443 is exposed at deploy time when SSL is enabled by deploy.sh.
      # Leave this commented out for HTTP-only deployments.
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:80/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  pgdata:
  redisdata:
  uploads:
