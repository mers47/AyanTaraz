version: "3.8"
services:
  postgres:
    image: postgres:16-alpine
    container_name: ayan-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ayan_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-ayan_taraz}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ayan_user}"]
      interval: 10s
      retries: 5
  redis:
    image: redis:7-alpine
    container_name: ayan-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 5
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ayan-backend
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:4000:4000"
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # IMPORTANT: must stay EMPTY for production behind Nginx.
        # The browser calls the API via the relative "/api" path which Nginx
        # proxies to the backend. Setting this to http://backend:4000 breaks
        # browser requests (the browser cannot resolve the internal hostname),
        # which is what caused the admin panel infinite-refresh loop.
        NEXT_PUBLIC_API_URL: ""
        NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL:-http://localhost}
    container_name: ayan-frontend
    restart: unless-stopped
    env_file: .env
    depends_on:
      - backend
    ports:
      - "127.0.0.1:3000:3000"
  nginx:
    image: nginx:alpine
    container_name: ayan-nginx
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - backend
      - frontend
volumes:
  pgdata:
  redisdata:
